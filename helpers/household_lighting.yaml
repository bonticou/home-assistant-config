# Shared physical lighting inventory for away reminders and their explicit action.
# Includes scheduled/night/vacation lights by Trevor's November 18 instruction.
# Group aliases and equipment/status LEDs are not household lighting loads.
# Keep unknown/unavailable members: they must never disappear from verification.
sensor:
  - name: household_lighting_inventory
    unique_id: household_lighting_inventory
    state: ready
    icon: mdi:lightbulb-group-outline
    attributes:
      targets: >
        {% set known = {
          "light.back_patio_light": "Back Patio Light",
          "light.back_stairs_back_stairs": "Back Stairs Back Stairs",
          "light.deck_deck_lights": "Deck Deck Lights",
          "light.exterior_deck_lights": "Exterior Deck Lights",
          "light.exterior_yard_lights": "Exterior Yard Lights",
          "light.family_room_main_lights_1": "Family Room Main Lights 1",
          "light.family_room_main_lights_2": "Family Room Main Lights 2",
          "light.family_room_main_lights_3": "Family Room Main Lights 3",
          "light.front_foyer_ceiling_lights": "Front Foyer Ceiling Lights",
          "light.front_foyer_chandelier": "Front Foyer Chandelier",
          "light.kitchen_coffee_bar": "Kitchen Coffee Bar",
          "light.kitchen_island": "Kitchen Island",
          "light.kitchen_main": "Kitchen Main",
          "light.kitchen_sink_light": "Kitchen Sink Light",
          "light.kitchen_table_lights": "Kitchen Table Lights",
          "light.master_bathroom_main_lights": "Master Bathroom Main Lights",
          "light.master_bathroom_shower_lights": "Master Bathroom Shower Lights",
          "light.master_bathroom_vanity_lights": "Master Bathroom Vanity Lights",
          "light.master_bedroom_lantern": "Master Bedroom Lantern",
          "light.master_bedroom_sconce_l": "Master Bedroom Sconce L",
          "light.master_bedroom_sconce_r": "Master Bedroom Sconce R",
          "light.master_casey_s_closet": "Casey's closet",
          "light.mudroom_main_lights": "Mudroom Main Lights",
          "light.mudroom_nook_lights": "Mudroom Nook Lights",
          "light.office_office_main_lights": "Office Office Main Lights",
          "light.ratgdo32_4536e8_light": "Trevor's garage opener light",
          "light.ratgdo32disco_c26634_light": "Casey's garage opener light",
          "light.stairs_front_stairs": "Stairs Front Stairs",
          "light.upstairs_hallway_main_lights": "Upstairs Hallway Main Lights",
          "light.vestibule_main_lights": "Vestibule Main Lights",
          "light.wynn_s_room_ceiling_lights": "Wynn S Room Ceiling Lights",
          "light.wynn_s_room_chandelier": "Wynn S Room Chandelier",
          "light.wynn_s_room_wynn_s_room_closet_light": "Wynn's closet",
          "switch.exterior_mud_room_stairs": "Exterior Mud Room Stairs",
          "switch.family_room_uplight": "Family Room Uplight",
          "switch.flower_lamp": "Flower Lamp",
          "switch.front_foyer_sconces": "Front Foyer Sconces",
          "switch.garage_garage_lights": "Garage Garage Lights",
          "switch.master_lantern": "Master door lantern",
          "switch.office_uplights": "Office Uplights",
          "switch.uplight": "Uplight 1",
          "switch.uplight_2": "Uplight 2"
        } %}
        {# Lutron light entities are physical lighting loads; other integrations
           and switch-domain lamps require verified onboarding below. #}
        {% set ns = namespace(targets=known) %}
        {% set lutron = integration_entities('lutron_caseta') %}
        {% for item in states.light if item.entity_id in lutron and item.attributes.entity_id is not defined %}
          {% if item.entity_id not in ns.targets %}
            {% set ns.targets = dict(ns.targets, **{item.entity_id: item.name}) %}
          {% endif %}
        {% endfor %}
        {{ ns.targets }}
  - name: away_security_active_lights
    unique_id: away_security_active_lights
    icon: mdi:lightbulb-alert-outline
    availability: "{{ is_state('sensor.household_lighting_inventory', 'ready') and state_attr('sensor.household_lighting_inventory', 'targets') is mapping }}"
    state: >
      {% set ns = namespace(ids=[]) %}
      {% for entity in state_attr('sensor.household_lighting_inventory', 'targets') | default({}, true) %}
        {% if is_state(entity, 'on') %}{% set ns.ids = ns.ids + [entity] %}{% endif %}
      {% endfor %}
      {{ ns.ids | count }}
    attributes:
      entity_ids: >
        {% set ns = namespace(ids=[]) %}
        {% for entity in state_attr('sensor.household_lighting_inventory', 'targets') | default({}, true) %}
          {% if is_state(entity, 'on') %}{% set ns.ids = ns.ids + [entity] %}{% endif %}
        {% endfor %}
        {{ ns.ids | join('||') }}
      names: >
        {% set ns = namespace(names=[]) %}
        {% for entity, label in (state_attr('sensor.household_lighting_inventory', 'targets') | default({}, true)).items() %}
          {% if is_state(entity, 'on') %}{% set ns.names = ns.names + [label] %}{% endif %}
        {% endfor %}
        {{ ns.names | join('||') }}
      unavailable_entity_ids: >
        {% set ns = namespace(ids=[]) %}
        {% for entity in state_attr('sensor.household_lighting_inventory', 'targets') | default({}, true) %}
          {% if states(entity) not in ['on', 'off'] %}{% set ns.ids = ns.ids + [entity] %}{% endif %}
        {% endfor %}
        {{ ns.ids }}
      unavailable_names: >
        {% set ns = namespace(names=[]) %}
        {% for entity, label in (state_attr('sensor.household_lighting_inventory', 'targets') | default({}, true)).items() %}
          {% if states(entity) not in ['on', 'off'] %}{% set ns.names = ns.names + [label] %}{% endif %}
        {% endfor %}
        {{ ns.names }}
